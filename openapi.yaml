openapi: 3.1.0
info:
  title: Whisper Backend API
  version: 0.2.0
  description: |
    Бэкенд для Android-клиента (порт MacWhisper на Kotlin).
    Контракт соответствует схеме БД из миграции `V1__init.sql`:
    `users`, `refresh_tokens`, `recordings`, `transcriptions`, `transcript_segments`, `summaries`.

    Модель данных:
    - **Recording** — аудиофайл (сам файл в MinIO, в БД — метаданные).
    - **Transcription** — асинхронная задача расшифровки записи и её результат.
      У одной записи может быть несколько расшифровок (другая модель / язык).
    - **Summary** — асинхронная задача суммаризации расшифровки и её результат.
      Задачами служат сами транскрипции и суммаризации (поле `status`), отдельной сущности Job нет.

    Статусы задач (`job_status`): `queued` → `processing` → `done` | `failed`.

    Движки (Engine): расшифровку и суммаризацию выполняет внешний OpenAI-совместимый
    сервис, который выбирает пользователь (OpenAI, Groq, свой whisper-сервер и т.п.).
    Клиент хранит настройки движка у себя и передаёт их в каждом запросе на запуск задачи.
    Сервер не сохраняет `apiKey`: он живёт в памяти, пока задача в очереди.
    Если сервер перезапустится до выполнения, задача перейдёт в `failed`, и её нужно
    запустить повторно (`/retry` с тем же движком).

    Ошибки возвращаются в формате RFC 9457 (application/problem+json).
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Регистрация, вход, refresh-токены (таблицы users, refresh_tokens)
  - name: Account
    description: Профиль и сессии (users, refresh_tokens)
  - name: Recordings
    description: Аудиозаписи (recordings, файлы в MinIO)
  - name: Transcriptions
    description: Расшифровки (transcriptions, transcript_segments)
  - name: Summaries
    description: Суммаризации (summaries)
  - name: System

paths:
  # ───────────────────────────── System ─────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Проверка живости сервиса
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: 0.2.0 }

  # ───────────────────────────── Auth ─────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: Создаёт строку в `users` и первую сессию в `refresh_tokens`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email уже занят
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход по email и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление пары токенов (с ротацией)
      description: |
        Старый refresh-токен помечается `revoked_at`, выдаётся новый.
        Повторное использование отозванного токена отзывает все сессии пользователя.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход (отзыв refresh-токена текущей сессии)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204': { description: Выход выполнен }

  # ───────────────────────────── Account ─────────────────────────────
  /me:
    get:
      tags: [Account]
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      summary: Изменить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email уже занят
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Account]
      summary: Удалить аккаунт и все данные
      description: Каскадно удаляет записи, расшифровки, суммаризации и сессии; файлы в MinIO удаляет фоновая задача.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '204': { description: Аккаунт удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/password:
    put:
      tags: [Account]
      summary: Сменить пароль
      description: Отзывает все сессии, кроме текущей.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, minLength: 8, format: password }
      responses:
        '204': { description: Пароль изменён }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions:
    get:
      tags: [Account]
      summary: Активные сессии (неотозванные и неистёкшие refresh-токены)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }

  /me/sessions/{sessionId}:
    delete:
      tags: [Account]
      summary: Завершить сессию на другом устройстве
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Сессия отозвана }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Recordings ─────────────────────────────
  /recordings:
    get:
      tags: [Recordings]
      summary: Список записей (пагинация, поиск, дельта-синхронизация)
      description: |
        С `updatedSince` возвращаются записи с `updated_at > updatedSince`,
        включая мягко удалённые (`deletedAt != null`). Без него удалённые не возвращаются.
        `q` ищет по названию и по `full_text` расшифровок (GIN-индекс).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: updatedSince
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Полнотекстовый поиск
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, -createdAt, updatedAt, -updatedAt, title]
            default: -createdAt
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingPage' }
    post:
      tags: [Recordings]
      summary: Загрузить аудио
      description: |
        Файл сохраняется в MinIO, в `recordings` пишутся метаданные.
        При `autoTranscribe: true` сразу создаётся расшифровка в статусе `queued`;
        для этого нужны поля `engineBaseUrl`, `engineApiKey`, `engineModel`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RecordingCreate' }
      responses:
        '201':
          description: Запись создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /recordings/{recordingId}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      tags: [Recordings]
      summary: Метаданные записи
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Recordings]
      summary: Переименовать запись
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Recordings]
      summary: Удалить запись (мягкое удаление, файл в MinIO чистится позже)
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }

  /recordings/{recordingId}/audio:
    get:
      tags: [Recordings]
      summary: Ссылка на скачивание / стриминг аудио
      description: Короткоживущий presigned URL MinIO (поддерживает Range).
      parameters:
        - $ref: '#/components/parameters/RecordingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        '404': { $ref: '#/components/responses/NotFound' }

  /recordings/{recordingId}/transcriptions:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      tags: [Transcriptions]
      summary: Все расшифровки записи (новые первыми)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TranscriptionBrief' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Transcriptions]
      summary: Поставить запись на расшифровку
      description: |
        Отвечает сразу, не дожидаясь результата. Аудио отправляется на
        `{engine.baseUrl}/audio/transcriptions` (формат `verbose_json`).
        Статус узнаётся через `GET /transcriptions/{transcriptionId}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscriptionCreate' }
      responses:
        '202':
          description: Задача создана в статусе queued
          headers:
            Location:
              schema: { type: string, example: /api/v1/transcriptions/3fa85f64-5717-4562-b3fc-2c963f66afa6 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Transcriptions ─────────────────────────────
  /transcriptions/{transcriptionId}:
    parameters:
      - $ref: '#/components/parameters/TranscriptionId'
    get:
      tags: [Transcriptions]
      summary: Статус и результат расшифровки
      description: Клиент опрашивает этот метод, пока `status` не станет `done` или `failed`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transcriptions]
      summary: Исправить текст вручную
      description: Доступно только для `status = done`. Меняет `full_text`; сегменты не пересчитываются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullText]
              properties:
                fullText: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Transcriptions]
      summary: Удалить расшифровку (или отменить, если ещё в очереди)
      description: Каскадно удаляет сегменты и суммаризации этой расшифровки.
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }

  /transcriptions/{transcriptionId}/retry:
    post:
      tags: [Transcriptions]
      summary: Перезапустить упавшую расшифровку
      description: |
        Только для `status = failed`. Возвращает в `queued`.
        Движок передаётся заново: сервер не хранит ключи.
      parameters:
        - $ref: '#/components/parameters/TranscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine: { $ref: '#/components/schemas/TranscriptionEngine' }
      responses:
        '202':
          description: Поставлено в очередь повторно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transcriptions/{transcriptionId}/segments:
    get:
      tags: [Transcriptions]
      summary: Сегменты с таймкодами (для подсветки в плеере)
      parameters:
        - $ref: '#/components/parameters/TranscriptionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Segment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transcriptions/{transcriptionId}/export:
    get:
      tags: [Transcriptions]
      summary: Экспорт в текст или субтитры
      parameters:
        - $ref: '#/components/parameters/TranscriptionId'
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [txt, srt, vtt]
      responses:
        '200':
          description: Файл
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/plain:
              schema: { type: string }
            text/vtt:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /transcriptions/{transcriptionId}/summaries:
    parameters:
      - $ref: '#/components/parameters/TranscriptionId'
    get:
      tags: [Summaries]
      summary: Все суммаризации расшифровки (новые первыми)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Summary' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Summaries]
      summary: Поставить суммаризацию
      description: Расшифровка должна быть в статусе `done`. Для `kind = custom` поле `prompt` обязательно.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SummaryCreate' }
      responses:
        '202':
          description: Задача создана в статусе queued
          headers:
            Location:
              schema: { type: string, example: /api/v1/summaries/3fa85f64-5717-4562-b3fc-2c963f66afa6 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Summaries ─────────────────────────────
  /summaries/{summaryId}:
    parameters:
      - $ref: '#/components/parameters/SummaryId'
    get:
      tags: [Summaries]
      summary: Статус и результат суммаризации
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Summaries]
      summary: Удалить суммаризацию
      responses:
        '204': { description: Удалено }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RecordingId:
      name: recordingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TranscriptionId:
      name: transcriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SummaryId:
      name: summaryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: id из refresh_tokens
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `nextCursor` предыдущей страницы
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: UUID от клиента. Повтор запроса с тем же ключом не создаст дубликат (плохая мобильная сеть).
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Не авторизован / неверные данные входа
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Не найдено (или принадлежит другому пользователю)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Действие недоступно в текущем статусе задачи
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: Файл слишком большой
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type: { type: string, format: uri, example: 'https://api.example.com/errors/validation' }
        title: { type: string, example: Validation failed }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Машиночитаемый код ошибки, example: EMAIL_TAKEN }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    TranscriptionEngine:
      type: object
      description: |
        OpenAI-совместимый сервис расшифровки. Сервер шлёт `POST {baseUrl}/audio/transcriptions`
        с `Authorization: Bearer {apiKey}`. Модель должна поддерживать `response_format=verbose_json`.
      required: [baseUrl, apiKey, model]
      properties:
        baseUrl: { type: string, format: uri, example: 'https://api.groq.com/openai/v1' }
        apiKey: { type: string, writeOnly: true, description: Не сохраняется и не возвращается в ответах }
        model: { type: string, example: whisper-large-v3 }

    ChatEngine:
      type: object
      description: |
        OpenAI-совместимый сервис для суммаризации. Сервер шлёт `POST {baseUrl}/chat/completions`
        с `Authorization: Bearer {apiKey}`.
      required: [baseUrl, apiKey, model]
      properties:
        baseUrl: { type: string, format: uri, example: 'https://api.openai.com/v1' }
        apiKey: { type: string, writeOnly: true, description: Не сохраняется и не возвращается в ответах }
        model: { type: string, example: gpt-4o-mini }

    JobStatus:
      type: string
      description: Тип `job_status` в БД
      enum: [queued, processing, done, failed]

    SummaryKind:
      type: string
      description: Тип `summary_kind` в БД
      enum: [short, detailed, action_items, custom]

    # ── users / refresh_tokens ──
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
        displayName: { type: string, maxLength: 100 }
        deviceInfo: { type: string, example: Pixel 8, description: Пишется в refresh_tokens.device_info }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        deviceInfo: { type: string, example: Pixel 8 }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Время жизни access-токена, сек, example: 900 }
        user: { $ref: '#/components/schemas/User' }

    User:
      type: object
      description: users
      required: [id, email, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserUpdate:
      type: object
      properties:
        email: { type: string, format: email }
        displayName: { type: [string, 'null'], maxLength: 100 }

    Session:
      type: object
      description: refresh_tokens (без token_hash)
      required: [id, createdAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean, description: Сессия, с которой сделан запрос }

    # ── recordings ──
    RecordingCreate:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: flac, mp3, mp4, m4a, ogg, opus, wav, webm. Имя файла → original_filename
        title: { type: string, description: По умолчанию — имя файла }
        durationMs: { type: integer, format: int64, description: Если не передана — сервер определит сам }
        checksumSha256: { type: string, description: Сервер сверит с загруженным файлом }
        autoTranscribe: { type: boolean, default: false }
        engineBaseUrl: { type: string, format: uri, description: 'Для autoTranscribe: см. TranscriptionEngine.baseUrl', example: 'https://api.groq.com/openai/v1' }
        engineApiKey: { type: string, writeOnly: true, description: 'Для autoTranscribe: не сохраняется' }
        engineModel: { type: string, description: 'Для autoTranscribe', example: whisper-large-v3 }
        language: { type: string, description: Язык для autoTranscribe, ISO 639-1, example: ru }

    Recording:
      type: object
      description: recordings (storage_bucket / storage_key наружу не отдаются)
      required: [id, title, mimeType, sizeBytes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        originalFilename: { type: [string, 'null'] }
        mimeType: { type: string, example: audio/mp4 }
        sizeBytes: { type: integer, format: int64 }
        durationMs: { type: [integer, 'null'], format: int64 }
        checksumSha256: { type: [string, 'null'] }
        latestTranscription:
          description: Последняя расшифровка записи (вычисляется), null если нет
          oneOf:
            - $ref: '#/components/schemas/TranscriptionBrief'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time, description: Не null только в ответах с updatedSince }

    RecordingUpdate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }

    RecordingPage:
      type: object
      required: [items, serverTime]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Recording' }
        nextCursor: { type: [string, 'null'] }
        serverTime: { type: string, format: date-time, description: Использовать как следующий updatedSince }

    DownloadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }

    # ── transcriptions / transcript_segments ──
    TranscriptionCreate:
      type: object
      required: [engine]
      properties:
        engine: { $ref: '#/components/schemas/TranscriptionEngine' }
        language: { type: [string, 'null'], description: ISO 639-1; null — автоопределение, example: ru }

    TranscriptionBrief:
      type: object
      description: transcriptions без полного текста — для списков
      required: [id, recordingId, status, model, createdAt]
      properties:
        id: { type: string, format: uuid }
        recordingId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        model: { type: string }
        language: { type: [string, 'null'] }
        preview: { type: [string, 'null'], description: Первые ~200 символов full_text }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Transcription:
      type: object
      description: transcriptions (result_key и search_tsv наружу не отдаются)
      required: [id, recordingId, status, model, attempts, createdAt]
      properties:
        id: { type: string, format: uuid }
        recordingId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        model: { type: string, description: engine.model из запроса }
        language: { type: [string, 'null'] }
        fullText: { type: [string, 'null'], description: Заполнено при status = done }
        errorMessage: { type: [string, 'null'], description: Заполнено при status = failed }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Segment:
      type: object
      description: transcript_segments
      required: [seq, startMs, endMs, text]
      properties:
        seq: { type: integer }
        startMs: { type: integer, format: int64 }
        endMs: { type: integer, format: int64 }
        text: { type: string }
        speaker: { type: [string, 'null'], example: SPEAKER_1 }
        confidence: { type: [number, 'null'], format: float }

    # ── summaries ──
    SummaryCreate:
      type: object
      required: [engine]
      properties:
        kind: { $ref: '#/components/schemas/SummaryKind' }
        engine: { $ref: '#/components/schemas/ChatEngine' }
        prompt: { type: string, description: Обязателен для kind = custom }

    Summary:
      type: object
      description: summaries
      required: [id, transcriptionId, kind, status, model, createdAt]
      properties:
        id: { type: string, format: uuid }
        transcriptionId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SummaryKind' }
        status: { $ref: '#/components/schemas/JobStatus' }
        model: { type: string }
        prompt: { type: [string, 'null'] }
        content: { type: [string, 'null'], description: Заполнено при status = done }
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }